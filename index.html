<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الوزن المثالي — الموارد البشرية</title>
<meta name="description" content="نظام الموارد البشرية لشركة الوزن المثالي">
<meta name="theme-color" content="#2f6b3a">
<!-- ?v=duty installs the supervisors' "دوامي" app (its own name, opens on the duty page). -->
<script>
  (function () {
    var v = new URLSearchParams(location.search).get('v'), duty = v === 'duty', branch = v === 'branch';
    document.write('<link rel="manifest" href="' + (duty ? 'manifest-duty.webmanifest' : branch ? 'manifest-branch.webmanifest' : 'manifest.webmanifest') + '">' +
      '<meta name="apple-mobile-web-app-title" content="' + (duty ? 'دوامي' : branch ? 'دوامي — الفروع' : 'الوزن المثالي HR') + '">');
    if (duty) document.title = 'دوامي — الوزن المثالي';
    if (branch) document.title = 'دوامي — الفروع';
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--green:#2f6b3a;--purple:#652b7c;--bg:#ffffff;--text:#1d2b22;--muted:#5d6b62}
  html,body{margin:0;height:100%;background:var(--bg);font-family:Cairo,Tahoma,system-ui,sans-serif;color:var(--text)}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .3s}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:160px;height:160px}
  #splash p{margin:0;color:var(--muted);font-size:15px}
  .spinner{width:34px;height:34px;border-radius:50%;border:4px solid #e3ece4;border-top-color:var(--green);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}#splash{transition:none}}
  #offline{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);text-align:center;padding:16px}
  #offline.show{display:flex}
  #offline b{font-size:18px;color:var(--purple)}
  #offline button{margin-top:8px;border:0;border-radius:10px;padding:10px 22px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  #install{display:none;position:fixed;bottom:16px;left:16px;z-index:5;border:0;border-radius:999px;padding:10px 18px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  #install.show{display:block}
</style>
</head>
<body>
<!-- The HR system (Google Apps Script web app) runs live inside this frame. -->
<iframe id="app" title="نظام الموارد البشرية — الوزن المثالي"
  allow="clipboard-read; clipboard-write; fullscreen; geolocation"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div id="splash" role="status" aria-live="polite">
  <img src="icon-512.png" alt="الوزن المثالي">
  <div class="spinner" aria-hidden="true"></div>
  <p>جارٍ فتح نظام الموارد البشرية…</p>
</div>

<div id="offline" role="alert">
  <b>لا يوجد اتصال بالإنترنت</b>
  <span>نظام الموارد البشرية يحتاج اتصالاً بالإنترنت. تأكد من الاتصال ثم أعد المحاولة.</span>
  <button type="button" onclick="location.reload()">إعادة المحاولة</button>
</div>

<button id="install" type="button">تثبيت التطبيق على الجهاز</button>

<script>
  // Official HR system link (Apps Script deployment). Change only this line if
  // the system ever moves to a new deployment.
  var HR_SYSTEM_URL = 'https://script.google.com/macros/s/AKfycbySpm0ZVHNYjfdF6tjpP9uYwUAZyGE2L7b7rOyRrKHR3JCDMNMu7dsvO4pdfAI-PTQ/exec';

  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  if (navigator.onLine === false) {
    document.getElementById('offline').classList.add('show');
    splash.classList.add('hide');
  } else {
    frame.addEventListener('load', function () { splash.classList.add('hide'); });
    // ?v=duty opens the supervisors' duty page ("دوامي"), ?v=branch the branch staff page
    // ("دوامي — الفروع"), instead of the full system.
    var view = new URLSearchParams(location.search).get('v');
    frame.src = HR_SYSTEM_URL + (view === 'duty' || view === 'branch' ? '?v=' + view : '');
  }
  window.addEventListener('offline', function () { document.getElementById('offline').classList.add('show'); });
  window.addEventListener('online', function () { document.getElementById('offline').classList.remove('show'); });

  // Chrome / Edge install prompt: show our own button when installing is possible.
  var deferredPrompt = null, installBtn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e; installBtn.classList.add('show');
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () { deferredPrompt = null; installBtn.classList.remove('show'); });
  });
  window.addEventListener('appinstalled', function () { installBtn.classList.remove('show'); });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
